name: philos
description: "Daily philosophical quotes from the greatest thinkers in history."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  shimmer: ^3.0.0
  package_info_plus: ^8.0.0
  share_plus: ^9.0.0
  in_app_review: ^2.0.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
